<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genera Convocazioni - Area Domus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Area Domus</div>
        <ul class="navbar-menu">
            <li class="navbar-item">
                <a href="convocazioni.html" class="navbar-link active">
                    Genera convocazioni
                </a>
            </li>
            <li class="navbar-item">
                <a href="assegnazioni.html" class="navbar-link">
                    Genera assegnazioni
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="header-section">
                <h1 class="header-title">Genera convocazioni per <span id="selectedDate"></span></h1>
                <p class="header-subtitle">Seleziona i cleaner che verranno convocati per la giornata</p>
                <div class="date-selector-container">
                    <label for="dateSelector">📅 Seleziona data:</label>
                    <input type="date" id="dateSelector" onchange="updateSelectedDate()">
                </div>
            </div>

            <div class="content-section">
                <div id="messageContainer"></div>

                <div class="stats">
                    <div class="stats-content">
                        <span>👥 <span class="stats-number" id="selectedCount">0</span> cleaner selezionati</span>
                        <span>di <span class="stats-number" id="totalCount">0</span> disponibili</span>
                    </div>
                </div></div>

            <div class="cleaner-list" id="cleanerList">
                <div class="loading">Caricamento cleaner in corso...</div>
            </div>

            <div class="controls">
                <div class="generate-section">
                    <button class="btn btn-generate" id="generateBtn" onclick="generateSelection()">Genera</button>
                    <select class="percentage-select" id="percentageSelect">
                        <option value="0">0%</option>
                        <option value="10" selected>10%</option>
                        <option value="20">20%</option>
                        <option value="30">30%</option>
                    </select>
                </div>
                <button class="btn btn-confirm" id="confirmBtn" onclick="confirmSelection()">Conferma</button>
            </div>

            <div id="apartmentStatsContainer" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Overlay di caricamento -->
    <div id="loadingOverlay">
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-percentage" id="progressPercentage">0%</div>
        </div>
    </div>

    <script>
        let cleaners = [];
        let selectedFromFile = [];

        // Mostra messaggio all'utente
        function showMessage(text, type = 'info') {
            const container = document.getElementById('messageContainer');
            const message = document.createElement('div');
            message.className = `message message-${type}`;
            message.textContent = text;
            container.innerHTML = '';
            container.appendChild(message);

            // Rimuovi il messaggio dopo 5 secondi
            setTimeout(() => {
                if (container.contains(message)) {
                    container.removeChild(message);
                }
            }, 5000);
        }

        // Funzioni per controllare l'overlay di caricamento
        function showLoadingOverlay(message = 'Caricamento...') {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            updateProgress(0);
        }

        function updateLoadingText(message) {
            // Funzione vuota - testo rimosso
        }

        function updateProgress(percentage) {
            const progressFill = document.getElementById('progressFill');
            const progressPercentage = document.getElementById('progressPercentage');

            if (progressFill && progressPercentage) {
                progressFill.style.width = percentage + '%';
                progressPercentage.textContent = percentage + '%';
            }
        }

        function hideLoadingOverlay() {
            document.getElementById('loadingOverlay').style.display = 'none';
            updateProgress(0);
        }

        // Esegui script Python tramite fetch
        async function runPythonScript(scriptName, showSuccessMessage = true) {
            try {
                showLoadingOverlay();
                updateProgress(10);
                setButtonsEnabled(false);

                await new Promise(resolve => setTimeout(resolve, 300));
                updateProgress(25);

                const response = await fetch('/run-script', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ script: scriptName })
                });

                updateProgress(75);
                await new Promise(resolve => setTimeout(resolve, 200));

                const result = await response.json();
                updateProgress(100);

                await new Promise(resolve => setTimeout(resolve, 300));
                hideLoadingOverlay();

                if (result.success) {
                    if (showSuccessMessage) {
                        showMessage(`${scriptName} completato con successo`, 'success');
                    }
                    return true;
                } else {
                    showMessage(`Errore esecuzione ${scriptName}: ${result.error}`, 'error');
                    return false;
                }
            } catch (error) {
                hideLoadingOverlay();
                showMessage(`Errore di rete: ${error.message}`, 'error');
                return false;
            } finally {
                setButtonsEnabled(true);
            }
        }

        // Esegui script Python con percentuale e data
        async function runPythonScriptWithPercentage(scriptName, percentage) {
            try {
                // Prima esegui task_selection.py per caricare gli appartamenti della data selezionata
                const selectedDate = getSelectedDate();
                updateProgress(10);

                const taskSelectionResponse = await fetch('/run-script', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        script: 'task_selection.py',
                        date: selectedDate
                    })
                });

                updateProgress(25);
                await new Promise(resolve => setTimeout(resolve, 400));

                const taskResult = await taskSelectionResponse.json();
                if (!taskResult.success) {
                    showMessage(`Errore caricamento appartamenti: ${taskResult.error}`, 'error');
                    return false;
                }

                updateProgress(35);

                // Ora esegui cleaner_selection.py con la percentuale e la data
                const response = await fetch('/run-script', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        script: scriptName,
                        percentage: percentage,
                        date: selectedDate
                    })
                });

                updateProgress(80);
                await new Promise(resolve => setTimeout(resolve, 300));

                const result = await response.json();
                updateProgress(100);

                await new Promise(resolve => setTimeout(resolve, 300));

                if (result.success) {
                    return true;
                } else {
                    showMessage(`Errore esecuzione ${scriptName}: ${result.error}`, 'error');
                    return false;
                }
            } catch (error) {
                showMessage(`Errore di rete: ${error.message}`, 'error');
                return false;
            }
        }

        // Abilita/disabilita pulsanti
        function setButtonsEnabled(enabled) {
            document.getElementById('generateBtn').disabled = !enabled;
            document.getElementById('confirmBtn').disabled = !enabled;
        }

        // Carica cleaners dal JSON senza selezioni precedenti
        async function loadCleaners(forceRefresh = false) {
            try {
                if (forceRefresh) {
                    showLoadingOverlay();
                    updateProgress(10);

                    await new Promise(resolve => setTimeout(resolve, 800));
                    updateProgress(25);

                    await runPythonScript('cleaner_list.py', false);
                    updateProgress(50);
                    await new Promise(resolve => setTimeout(resolve, 600));
                } else {
                    showLoadingOverlay();
                    updateProgress(15);
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                updateProgress(60);
                await new Promise(resolve => setTimeout(resolve, 400));

                const response = await fetch('/data/modello_cleaners.json');
                updateProgress(75);

                await new Promise(resolve => setTimeout(resolve, 500));

                const data = await response.json();
                cleaners = data.cleaners;
                updateProgress(90);

                await new Promise(resolve => setTimeout(resolve, 600));

                displayCleaners();
                updateStats();
                updateProgress(100);

                // Piccola pausa per mostrare il 100%
                await new Promise(resolve => setTimeout(resolve, 300));
                hideLoadingOverlay();
                showMessage(`Cleaner caricati con successo (${cleaners.length} disponibili)`, 'success');
            } catch (error) {
                hideLoadingOverlay();
                console.error('Errore nel caricamento dei cleaner:', error);
                showMessage('Errore nel caricamento dei dati dei cleaner', 'error');
            }
        }

        // Aggiorna i dati dei cleaner dal database
        async function refreshCleanerData() {
            await loadCleaners(true);
        }

        // Mostra cleaners nella lista
        function displayCleaners() {
            const cleanerList = document.getElementById('cleanerList');
            cleanerList.innerHTML = '';

            cleaners.forEach((cleaner, index) => {
                const cleanerItem = document.createElement('div');
                cleanerItem.className = 'cleaner-item';

                const isSelected = selectedFromFile.some(sel => sel.id === cleaner.id);
                const roleClass = cleaner.role.toLowerCase() === 'premium' ? 'role-premium' : 'role-standard';

                cleanerItem.innerHTML = `
                    <div class="cleaner-info">
                        <div class="cleaner-avatar">
                        </div>
                        <div class="cleaner-details">
                            <div class="cleaner-name">${cleaner.name} ${cleaner.lastname}</div>
                            <span class="cleaner-role ${roleClass}">${cleaner.role}</span>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="cleaner-${index}" 
                               ${isSelected ? 'checked' : ''} 
                               onchange="updateStats()" 
                               data-cleaner-id="${cleaner.id}">
                        <span class="slider"></span>
                    </label>
                `;

                cleanerList.appendChild(cleanerItem);
            });
        }

        // Aggiorna statistiche
        function updateStats() {
            const checkboxes = document.querySelectorAll('#cleanerList input[type="checkbox"]');
            const selectedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const totalCount = checkboxes.length;

            document.getElementById('selectedCount').textContent = selectedCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        // Genera selezione basata su percentuale
        async function generateSelection() {
            // Ottieni la percentuale selezionata
            const percentage = document.getElementById('percentageSelect').value;

            // Mostra immediatamente la barra di progresso
            showLoadingOverlay('Generazione convocazioni in corso...');
            updateProgress(5);
            setButtonsEnabled(false);

            // Prima esegui cleaner_selection.py con la percentuale
            const success = await runPythonScriptWithPercentage('cleaner_selection.py', percentage);
            if (!success) {
                hideLoadingOverlay();
                setButtonsEnabled(true);
                return;
            }

            // Ricarica la lista con le nuove selezioni
            try {
                const selResponse = await fetch('/data/sel_cleaners.json');
                if (selResponse.ok) {
                    const selData = await selResponse.json();
                    const selectedDate = getSelectedDate();
                    
                    // Estrai i cleaner dalla struttura corretta (dates[data].cleaners)
                    let cleanersForDate = [];
                    if (selData.dates && selData.dates[selectedDate]) {
                        cleanersForDate = selData.dates[selectedDate].cleaners || [];
                    }
                    
                    selectedFromFile = cleanersForDate;

                    // Aggiorna le checkbox in base al file generato
                    const checkboxes = document.querySelectorAll('#cleanerList input[type="checkbox"]');
                    checkboxes.forEach((checkbox, index) => {
                        const cleanerId = parseInt(checkbox.dataset.cleanerId);
                        const isSelected = selectedFromFile.some(sel => sel.id === cleanerId);
                        checkbox.checked = isSelected;
                    });

                    updateStats();

                    // Mostra le statistiche degli appartamenti se disponibili
                    if (selData.dates && selData.dates[selectedDate] && selData.dates[selectedDate].apartment_stats) {
                        displayApartmentStats(selData.dates[selectedDate].apartment_stats);
                    }

                    hideLoadingOverlay();
                    setButtonsEnabled(true);
                    showMessage(`Selezione automatica completata: ${selectedFromFile.length} cleaner selezionati`, 'success');
                }
            } catch (error) {
                hideLoadingOverlay();
                setButtonsEnabled(true);
                showMessage('Errore nel caricamento della selezione generata', 'error');
            }
        }

        // Mostra le statistiche degli appartamenti
        function displayApartmentStats(apartmentStats) {
            const container = document.getElementById('apartmentStatsContainer');
            if (container) {
                container.innerHTML = `
                    <div class="apartment-stats">
                        <p><strong>Appartamenti da pulire:</strong> ${apartmentStats.total_apartments}</p>
                        <p><strong>Appartamenti aggiuntivi stimati (${apartmentStats.percentage_used}%):</strong> ${apartmentStats.extra_apartments}</p>
                    </div>
                `;
                container.style.display = 'block';
            }
        }

        // Conferma selezione e salva nel file
        async function confirmSelection() {
            const selectedCleaners = [];
            const checkboxes = document.querySelectorAll('#cleanerList input[type="checkbox"]');

            checkboxes.forEach((checkbox, index) => {
                if (checkbox.checked) {
                    const cleanerId = parseInt(checkbox.dataset.cleanerId);
                    const cleaner = cleaners.find(c => c.id === cleanerId);
                    if (cleaner) {
                        selectedCleaners.push(cleaner);
                    }
                }
            });

            if (selectedCleaners.length === 0) {
                showMessage('Seleziona almeno un cleaner prima di confermare.', 'error');
                return;
            }

            // Salva la selezione nel file sel_cleaners.json
            const selectedDate = getSelectedDate();
            const selectionData = {
                timestamp: new Date().toISOString(),
                cleaners: selectedCleaners,
                total_selected: selectedCleaners.length,
                total_available: cleaners.length,
                date: selectedDate
            };

            try {
                showLoadingOverlay();
                updateProgress(20);
                setButtonsEnabled(false);

                await new Promise(resolve => setTimeout(resolve, 300));
                updateProgress(50);

                const response = await fetch('/save-selection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(selectionData)
                });

                updateProgress(80);
                await new Promise(resolve => setTimeout(resolve, 200));

                const result = await response.json();
                updateProgress(100);

                await new Promise(resolve => setTimeout(resolve, 300));
                hideLoadingOverlay();

                if (result.success) {
                    const displayDate = selectedDate.split('-').reverse().join('/');
                    showMessage(`Selezione confermata per il ${displayDate}! ${selectedCleaners.length} cleaner selezionati.`, 'success');
                } else {
                    showMessage(`Errore nel salvataggio: ${result.error}`, 'error');
                }
            } catch (error) {
                hideLoadingOverlay();
                showMessage(`Errore di rete: ${error.message}`, 'error');
            } finally {
                setButtonsEnabled(true);
            }
        }

        // Inizializza la data al caricamento della pagina
        function initializeDate() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);

            const year = tomorrow.getFullYear();
            const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const day = String(tomorrow.getDate()).padStart(2, '0');

            const tomorrowString = `${year}-${month}-${day}`;
            const displayDate = `${day}/${month}/${year}`;

            document.getElementById('dateSelector').value = tomorrowString;
            document.getElementById('selectedDate').textContent = displayDate;
        }

        // Aggiorna la data selezionata e carica i cleaner per quella data
        function updateSelectedDate() {
            const selectedDateValue = document.getElementById('dateSelector').value;
            if (selectedDateValue) {
                const [year, month, day] = selectedDateValue.split('-');
                const displayDate = `${day}/${month}/${year}`;
                document.getElementById('selectedDate').textContent = displayDate;

                showMessage(`Data aggiornata a: ${displayDate}`, 'info');

                // Carica i cleaner selezionati per questa data
                loadCleanersForDate(selectedDateValue);
            }
        }

        // Carica i cleaner selezionati per una data specifica
        async function loadCleanersForDate(selectedDate) {
            try {
                const response = await fetch(`/get-cleaners-by-date?date=${selectedDate}`);
                const result = await response.json();

                if (result.success) {
                    selectedFromFile = result.cleaners || [];

                    // Aggiorna le checkbox in base ai cleaner selezionati per questa data
                    const checkboxes = document.querySelectorAll('#cleanerList input[type="checkbox"]');
                    checkboxes.forEach((checkbox, index) => {
                        const cleanerId = parseInt(checkbox.dataset.cleanerId);
                        const isSelected = selectedFromFile.some(sel => sel.id === cleanerId);
                        checkbox.checked = isSelected;
                    });

                    updateStats();

                    // Mostra le statistiche degli appartamenti se disponibili
                    if (result.date_data && result.date_data.apartment_stats) {
                        displayApartmentStats(result.date_data.apartment_stats);
                    } else {
                        // Nascondi le statistiche se non ci sono dati per questa data
                        const container = document.getElementById('apartmentStatsContainer');
                        if (container) {
                            container.style.display = 'none';
                        }
                    }

                    if (selectedFromFile.length > 0) {
                        showMessage(`Caricati ${selectedFromFile.length} cleaner selezionati per il ${selectedDate.split('-').reverse().join('/')}`, 'success');
                    } else {
                        showMessage(`Nessun cleaner selezionato per il ${selectedDate.split('-').reverse().join('/')}`, 'info');
                    }
                } else {
                    showMessage(`Errore nel caricamento dei cleaner per la data: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Errore di rete: ${error.message}`, 'error');
            }
        }

        // Ottieni la data selezionata nel formato YYYY-MM-DD
        function getSelectedDate() {
            return document.getElementById('dateSelector').value;
        }

        // Carica i dati all'avvio
        window.addEventListener('load', function() {
            initializeDate();

            // Mostra immediatamente il loading all'avvio
            showLoadingOverlay();
            updateProgress(5);

            // Avvia il caricamento dei cleaners con un piccolo ritardo
            setTimeout(async () => {
                await loadCleaners(false); // Carica velocemente senza aggiornare il DB

                // Dopo aver caricato i cleaner, carica le selezioni per la data iniziale
                const initialDate = getSelectedDate();
                if (initialDate) {
                    loadCleanersForDate(initialDate);
                }
            }, 100);
        });
    </script>
</body>
</html>
